[package]
name = "spyweb"
version = "1.5.0"
edition = "2024"
authors = ["SpyWeb <support@spyweb.app>"]
description = "A lightweight, self-contained monitoring & scrapring engine with Lua customization support"
license = "MIT OR Apache-2.0"       
repository = "https://github.com/spyweb-app/spyweb"   
readme = "README.md"
keywords = ["scraper", "web-scraping", "lua", "monitoring", "automation", "command-line", "osint"]
categories = ["command-line-utilities", "web-programming"]
rust-version = "1.94.1"
default-run = "spyweb"
exclude = ["tests/", "jobs/", "logs/"]

[dependencies]
anyhow = "1.0.102"
# futures = "0.3.32"
mlua = { version = "0.11.6", features = ["vendored", "send", "async", "serialize"] }
notify = "8.2.0"
notify-rust = {version = "4.15.0"}
redb = { version = "4.0.0", optional = true }
rusqlite = { version = "0.34", optional = true, features = ["bundled"] }
rouille = "3.6.2"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
# smallvec = "1.15.1"
smol = "2.0.2"
toml = "1.1.2"
http = "1"
indexmap = "2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip", "socks-proxy", "json", "multipart"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] } 
chrono = { version = "0.4", default-features = false, features = ["clock"] }

winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true}
open = {version = "5.3.4", optional = true}
tray-icon = {version = "0.22.0", optional=true}
async-tungstenite = { version = "0.34.1", features = ["smol-runtime"] }
async-channel = "2.5.0"
futures-channel = "0.3.32"
async-process = "2.5.0"
fs4 = "0.8.2"
futures-lite = "2.6.1"
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help", "usage"] }
ctrlc = "3.4"
fastrand = "2.4.1"
tempfile = "3.17"

[features]
luau = ["mlua/luau"]
lua54 = ["mlua/lua54"]
redb = ["dep:redb"]
sqlite = ["dep:rusqlite"]
tray = ["tray-icon", "winit", "open"]
default = ["luau", "redb"]

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1   
# panic = "abort"     
strip = true        
# strip = false
# debug = true

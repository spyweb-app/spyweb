<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpyWeb - Records Viewer</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #0f0f0f;
            --glass: rgba(15, 15, 15, 0.85);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent: #e11d48;
            --accent2: #fb7185;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sweep-pos: -100%;
        }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        .title-gradient {
            color: var(--accent);
            font-weight: 800;
        }

        .glass-sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .navbar.is-glass {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
        }

        .glass-card {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        /* The Wipe Effect */
        .theme-sweep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.1;
            pointer-events: none;
            z-index: 10000;
            transform: translateX(var(--sweep-pos));
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* Menu Styling */
        .menu-list a {
            color: var(--text-muted);
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .menu-list a:hover {
            background-color: color-mix(in srgb, var(--accent), transparent 90%);
            color: var(--text-main);
        }
        .menu-list a.is-active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .menu-list a.is-active:hover {
            background: var(--accent);
            opacity: 0.9;
        }
        .menu-label {
            color: var(--text-muted);
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        /* Table Styling */
        .table-container {
            border-radius: 12px;
            overflow: auto;
            border: 1px solid var(--glass-border);
            background: var(--bg-surface);
        }
        
        .table {
            background-color: transparent;
            color: var(--text-main);
            margin-bottom: 0;
        }
        .table thead th {
            border-bottom: 1px solid var(--glass-border);
            color: var(--accent) !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            padding: 1rem;
            background: var(--bg-deep);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table td, .table th {
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem;
            vertical-align: middle;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table.is-hoverable tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tag.is-primary-gradient {
            background: var(--accent);
            color: white;
            border: none;
        }

        .button.is-info.is-outlined {
            border-color: var(--accent);
            color: var(--accent);
        }
        .button.is-info.is-outlined:hover {
            background-color: var(--accent);
            color: #fff;
        }

        .tag.is-rounded {
            border-radius: 100px;
        }

        .scrollable-y {
            overflow-y: auto;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2); 
        }

        * {
            transition: border-color 0.4s ease, background-color 0.4s ease, color 0.4s ease;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="spywebApp()" x-init="initApp()" :style="themeStyles">
    <div class="theme-sweep" :style="{'--sweep-pos': sweepPos}"></div>

<div x-cloak class="columns is-gapless m-0" style="height: 100vh;">
    
    <!-- Sidebar -->
    <div class="column is-3-tablet is-2-desktop glass-sidebar is-hidden-mobile">
        <div class="p-5">
            <h1 class="title is-4 mb-5" style="display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="130 130 420 420" style="flex-shrink: 0;">
                    <g stroke="var(--accent)" stroke-width="20" fill="none" stroke-linejoin="round" stroke-linecap="round">
                        <line x1="340" y1="340" x2="550" y2="340"/>
                        <line x1="340" y1="340" x2="489" y2="489"/>
                        <line x1="340" y1="340" x2="340" y2="550"/>
                        <line x1="340" y1="340" x2="191" y2="489"/>
                        <line x1="340" y1="340" x2="130" y2="340"/>
                        <line x1="340" y1="340" x2="191" y2="191"/>
                        <line x1="340" y1="340" x2="340" y2="130"/>
                        <line x1="340" y1="340" x2="489" y2="191"/>
                        <path d="M 450,340 Q 420,365 418,418 Q 365,420 340,450 Q 315,420 262,418 Q 260,365 230,340 Q 260,315 262,262 Q 315,260 340,230 Q 365,260 418,262 Q 420,315 450,340"/>
                        <path d="M 538,340 Q 472,395 480,480 Q 395,472 340,538 Q 285,472 200,480 Q 208,395 142,340 Q 208,285 200,200 Q 285,208 340,142 Q 395,208 480,200 Q 472,285 538,340"/>
                    </g>
                </svg>
                <span>Spy<b class="title-gradient">Web</b></span>
            </h1>
        </div>
        
        <div class="px-3 pb-5 scrollable-y is-flex-grow-1">
            <aside class="menu">
                <p class="menu-label">Views</p>
                <ul class="menu-list">
                    <li>
                        <a :class="{'is-active': selectedJob === ''}" @click="selectJob('')">
                            <span>All Recent Records</span>
                        </a>
                    </li>
                </ul>

                <p class="menu-label mt-5">Jobs</p>
                <ul class="menu-list">
                    <template x-show="loadingJobs">
                        <li><a class="has-text-grey">Loading...</a></li>
                    </template>
                    <template x-for="job in jobs" :key="job.id">
                        <li>
                            <a :class="{'is-active': selectedJob === job.id}" 
                               :style="!job.enabled ? 'opacity: 0.4; filter: grayscale(100%);' : ''"
                               @click="selectJob(job.id)" x-text="job.name"></a>
                        </li>
                    </template>
                </ul>
            </aside>
        </div>
    </div>

    <!-- Main Content -->
    <div class="column is-12-mobile is-9-tablet is-10-desktop is-flex is-flex-direction-column">
        
        <!-- Header Nav -->
        <nav class="navbar is-glass px-5 is-flex is-align-items-center is-justify-content-space-between" style="min-height: 4.5rem;">
            <div class="is-flex is-align-items-center">
                <h2 class="title is-5 has-text-white mb-0" x-text="selectedJob ? (jobs.find(j => j.id === selectedJob)?.name || selectedJob) : 'Recent Records'"></h2>
                <span class="tag is-primary-gradient is-rounded ml-3" x-show="!loadingRecords && records.length > 0" x-text="records.length + ' Items'"></span>    
            </div>
                        
            <!-- Theme Picker -->
            <div class="is-flex mr-5 is-hidden-mobile">
                <template x-for="(colors, name) in themes" :key="name">
                    <button class="button is-small p-0 m-1" :style="'background:' + colors.accent + '; border: none; width: 18px; height: 18px; min-width: 18px; border-radius: 4px;'" @click="triggerSweep(name)" :title="name"></button>
                </template>
            </div>
            
            <div class="is-flex is-align-items-center gap-3">
                <!-- Limit Selector -->
                <div class="is-flex is-align-items-center mr-4 is-hidden-mobile">
                    <span class="is-size-7 has-text-grey-light mr-2">Per Page</span>
                    <div class="select is-small is-dark is-rounded">
                        <select x-model="limit" @change="changeLimit($event.target.value)">
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <!-- Pagination Buttons -->
                <div class="buttons are-small mb-0 mr-4" x-show="selectedJob && (pageStack.length > 0 || hasMore)">
                    <button class="button is-dark is-rounded" @click="prevPage()" :disabled="pageStack.length === 0">
                        &larr; Prev
                    </button>
                    <button class="button is-dark is-rounded" @click="nextPage()" :disabled="!hasMore">
                        Next &rarr;
                    </button>
                </div>

                <div class="select is-small is-rounded is-dark mr-3 is-hidden-tablet">
                    <select x-model="selectedJob" @change="fetchRecords()">
                        <option value="">All Recent Records</option>
                        <template x-for="job in jobs" :key="job.id">
                            <option :value="job.id" x-text="job.name"></option>
                        </template>
                    </select>
                </div>
                <button class="button is-small is-outlined is-info is-rounded" @click="fetchRecords()" :class="{'is-loading': loadingRecords}">
                    Refresh
                </button>
            </div>
        </nav>

        <!-- Content Area -->
        <div class="p-5 is-flex-grow-1 scrollable-y">
            
            <!-- Loading State -->
            <div x-show="loadingRecords" class="has-text-centered py-6">
                <div class="loader is-loading is-size-1" :style="'margin: 0 auto; width: 3rem; height: 3rem; border-width: 3px; border-color: ' + themes[theme].accent + ' transparent ' + themes[theme].accent + ' transparent;'"></div>
                <p class="mt-4" :style="'color: ' + themes[theme].accent">Fetching records...</p>
            </div>

            <!-- Error State -->
            <div x-show="error" class="notification is-danger is-light glass-card mb-5" style="background: rgba(255, 56, 96, 0.1);">
                <button class="delete" @click="error = null"></button>
                <strong>Error:</strong> <span x-text="error"></span>
            </div>

            <!-- Empty State -->
            <div x-show="!loadingRecords && records.length === 0 && !error" class="has-text-centered py-6 glass-card">
                <p class="is-size-4 has-text-grey">No records found.</p>
                <p class="has-text-grey-dark mt-2">Try selecting a different job or wait for the scraper to run.</p>
            </div>

            <!-- Table View -->
            <div class="table-container" x-show="!loadingRecords && records.length > 0">
                <table class="table is-fullwidth is-hoverable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th x-show="!selectedJob">Job ID</th>
                            <template x-for="header in tableHeaders" :key="header">
                                <th x-text="header"></th>
                            </template>
                            <th>Keywords</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="record in records" :key="record.timestamp || Math.random()">
                            <tr>
                                <td class="has-text-grey-light is-size-7" style="white-space: nowrap;" x-text="formatDate(record.date_time)"></td>
                                <td x-show="!selectedJob">
                                    <span class="tag is-dark is-rounded is-small" x-text="jobs.find(j => j.id === record.job_id)?.name || record.job_id || 'Unknown'"></span>
                                </td>
                                
                                <template x-for="header in tableHeaders" :key="header">
                                    <td class="has-text-white is-size-6">
                                        <div x-html="formatValue(getFieldValue(record, header))"></div>
                                    </td>
                                </template>
                                
                                <td>
                                    <div class="tags">
                                        <template x-for="keyword in (record.match_key || [])" :key="keyword">
                                            <span class="tag is-rounded is-small mb-0 mr-0" 
                                                :style="'background: ' + themes[theme].accent + '15; color: ' + themes[theme].accent + '; border: 1px solid ' + themes[theme].accent + '33;'"
                                                x-text="keyword"></span>
                                        </template>
                                        <template x-if="!record.match_key || record.match_key.length === 0">
                                            <span class="has-text-grey-dark">-</span>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" :class="showAuthModal ? 'is-active' : ''">
        <div class="modal-background"></div>
        <div class="modal-content px-4">
            <div class="glass-card p-6 has-text-centered" style="max-width: 400px; margin: 0 auto; background: var(--bg-surface);">
                <span class="icon is-large mb-4" :style="'color: ' + themes[theme].accent">
                    <i class="fas fa-3x fa-shield-halved"></i>
                </span>
                <h3 class="title is-4 mb-2">Authentication Required</h3>
                <p class="subtitle is-6 mb-5">Please enter your SPYWEB_API_KEY to continue.</p>
                
                <div class="field mb-5">
                    <div class="control has-icons-left">
                        <input class="input is-dark is-rounded" type="password" placeholder="Enter API Key" 
                            x-model="apiKey" @keyup.enter="submitAuth()"
                            style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;">
                        <span class="icon is-small is-left">
                            <i class="fas fa-key"></i>
                        </span>
                    </div>
                </div>
                
                <button class="button is-fullwidth is-rounded" 
                    :style="'background: ' + themes[theme].accent + '; color: #fff; border: none; font-weight: 600;'"
                    @click="submitAuth()">
                    Unlock Dashboard
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('spywebApp', () => ({
            jobs: [],
            selectedJob: '',
            records: [],
            loadingJobs: false,
            loadingRecords: false,
            error: null,
            limit: 30,
            currentAfter: null,
            nextAfter: null,
            pageStack: [],
            hasMore: false,
            
            // Theme Management
            theme: 'crimson',
            sweepPos: '-100%',
            apiKey: localStorage.getItem('spyweb_api_key') || '',
            showAuthModal: false,
            authError: '',
            themes: {
                crimson: { accent: '#e11d48', accent2: '#fb7185' },
                emerald: { accent: '#10b981', accent2: '#34d399' },
                cobalt: { accent: '#3b82f6', accent2: '#60a5fa' },
                violet: { accent: '#8b5cf6', accent2: '#a78bfa' },
                amber: { accent: '#f59e0b', accent2: '#fbbf24' },
                pink: { accent: '#ec4899', accent2: '#f472b6' },
                rose: { accent: '#f43f5e', accent2: '#fb7185' },
                orange: { accent: '#f97316', accent2: '#fb923c' },
                cyan: { accent: '#06b6d4', accent2: '#22d3ee' },
                lime: { accent: '#84cc16', accent2: '#a3e635' }
            },

            initApp() {
                const themeKeys = Object.keys(this.themes);
                this.theme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
                this.fetchJobs();
                this.fetchRecords();
                this.startThemeCycle();
            },

            startThemeCycle() {
                const cycle = () => {
                    const themeKeys = Object.keys(this.themes);
                    let nextTheme;
                    do {
                        nextTheme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
                    } while (nextTheme === this.theme);
                    
                    this.triggerSweep(nextTheme);
                    const nextInterval = Math.floor(Math.random() * (60000 - 30000 + 1)) + 30000;
                    setTimeout(cycle, nextInterval);
                };
                setTimeout(cycle, 30000);
            },

            triggerSweep(nextTheme) {
                this.sweepPos = '100%';
                setTimeout(() => {
                    this.theme = nextTheme;
                    this.sweepPos = '-100%';
                }, 600);
            },

            get themeStyles() {
                const t = this.themes[this.theme];
                return {
                    '--accent': t.accent,
                    '--accent2': t.accent2
                };
            },
            
            selectJob(job) {
                this.selectedJob = job;
                this.resetPagination();
                this.fetchRecords();
            },

            resetPagination() {
                this.nextAfter = null;
                this.pageStack = [];
            },

            async changeLimit(newLimit) {
                this.limit = newLimit;
                this.resetPagination();
                await this.fetchRecords();
            },

            async next() {
                if (!this.nextAfter) return;
                this.pageStack.push(this.records[0].timestamp); 
                const currentAfter = this.records[this.records.length - 1].timestamp;
                this.pageStack.push(this.nextAfter); 
            },
            
            async apiFetch(url) {
                const res = await fetch(url, {
                    headers: { 'X-SpyWeb-Key': this.apiKey }
                });
                
                if (res.status === 401) {
                    this.showAuthModal = true;
                    throw new Error('Unauthorized');
                }
                
                if (!res.ok) throw new Error('API Error: ' + res.status);
                return res.json();
            },

            async fetchJobs() {
                this.loadingJobs = true;
                try {
                    this.jobs = await this.apiFetch('/api/jobs');
                } catch (err) {
                    if (err.message !== 'Unauthorized') {
                        console.error(err);
                        this.error = "Could not load jobs list.";
                    }
                } finally {
                    this.loadingJobs = false;
                }
            },

            async fetchRecords(after = null) {
                this.loadingRecords = true;
                this.error = null;
                
                try {
                    let url = '/api/records';
                    const params = new URLSearchParams();
                    params.append('limit', this.limit);
                    if (this.selectedJob) params.append('job_id', this.selectedJob);
                    if (after) params.append('after', after);
                    
                    url += `?${params.toString()}`;
                    
                    const data = await this.apiFetch(url);
                    
                    if (this.selectedJob) {
                        this.records = data.records || [];
                        this.nextAfter = data.next_after;
                        this.hasMore = data.has_more;
                    } else {
                        // All records view - simple limit
                        this.hasMore = false;
                        this.nextAfter = null;
                        let flattened = [];
                        for (const [jobId, jobRecords] of Object.entries(data)) {
                            jobRecords.forEach(r => {
                                r.job_id = jobId;
                                if (!r.date_time && r.timestamp) {
                                    r.date_time = new Date(r.timestamp / 1000000).toISOString();
                                }
                                flattened.push(r);
                            });
                        }
                        flattened.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        this.records = flattened; // server already limited it
                    }
                } catch (err) {
                    if (err.message !== 'Unauthorized') {
                        console.error(err);
                        this.error = "Could not load records.";
                    }
                } finally {
                    this.loadingRecords = false;
                }
            },

            async nextPage() {
                if (!this.nextAfter) return;
                this.pageStack.push(this.currentAfter);
                this.currentAfter = this.nextAfter;
                await this.fetchRecords(this.currentAfter);
            },

            async prevPage() {
                if (this.pageStack.length === 0) return;
                this.currentAfter = this.pageStack.pop();
                await this.fetchRecords(this.currentAfter);
            },

            submitAuth() {
                if (!this.apiKey) return;
                localStorage.setItem('spyweb_api_key', this.apiKey);
                this.showAuthModal = false;
                this.fetchJobs();
                this.fetchRecords();
            },

            // Compute dynamic headers based on the current records set
            get tableHeaders() {
                if (this.records.length === 0) return [];
                const headers = new Set();
                const hiddenKeys = ['job_id', 'timestamp', 'date_time', '_keywords', 'match_key'];
                
                this.records.forEach(r => {
                    const fieldsSource = r.fields ? r.fields : r;
                    for (const k of Object.keys(fieldsSource)) {
                        if (!hiddenKeys.includes(k) && typeof fieldsSource[k] !== 'object') {
                            headers.add(k);
                        }
                    }
                });
                return Array.from(headers);
            },
            
            getFieldValue(record, header) {
                const fieldsSource = record.fields ? record.fields : record;
                return fieldsSource[header];
            },
            
            formatDate(dateTimeStr) {
                if (!dateTimeStr) return '-';
                try {
                    return new Date(dateTimeStr).toLocaleString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });
                } catch (e) {
                    return dateTimeStr;
                }
            },
            
            formatValue(val) {
                if (val === undefined || val === null || val === '') return '<span class="has-text-grey-dark">-</span>';
                const str = String(val);
                
                // Escape function for basic HTML entities
                const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

                if (str.startsWith('http://') || str.startsWith('https://')) {
                    const safeUrl = str.split(' ')[0].replace(/"/g, '%22').replace(/'/g, '%27'); // Very basic URL safety
                    return `<a href="${safeUrl}" target="_blank" style="color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600;" rel="noopener noreferrer">View</a>`;
                }
                
                let displayStr = escape(str);
                if (displayStr.length > 200) {
                    displayStr = displayStr.substring(0, 200) + '...';
                }
                return displayStr;
            }
        }));
    });
</script>
</body>
</html>

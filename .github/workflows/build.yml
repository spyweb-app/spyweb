name: Release Binaries

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: spyweb-linux
          - os: macos-latest
            artifact_name: spyweb-macos
          - os: windows-latest
            artifact_name: spyweb-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libx11-dev libwayland-dev libxkbcommon-dev libxdo-dev

      - name: Build & Package
        shell: bash
        run: |
          # 1. Extract version once for the script
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          export SPYWEB_VERSION=$VERSION

          # 2. Build Versioned Assets
          bash ./release.sh
          
          # 3. Create Generic Copies (for 'latest' release)
          for f in spyweb-v*.*; do
            [ -e "$f" ] || continue
            new_f=$(echo "$f" | sed -E 's/-v[0-9.]+//')
            echo "Copying $f to $new_f"
            cp "$f" "$new_f"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: spyweb-*.*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Check if pre-release
        id: check_prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: release-assets/spyweb-v*.*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}

      - name: Create/Update Latest Release
        if: steps.check_prerelease.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Stable Release"
          body: "Always points to the most recent stable build of SpyWeb."
          files: |
            release-assets/spyweb-linux-*.zip
            release-assets/spyweb-macos-*.zip
            release-assets/spyweb-windows-*.zip
            release-assets/spyweb-linux-*.tar.gz
            release-assets/spyweb-macos-*.tar.gz
            release-assets/spyweb-windows-*.tar.gz
          draft: false
          prerelease: false
          make_latest: true

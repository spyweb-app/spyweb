name: Release Binaries

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: spyweb-linux
          - os: macos-latest
            artifact_name: spyweb-macos
          - os: windows-latest
            artifact_name: spyweb-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libx11-dev libwayland-dev libxkbcommon-dev libxdo-dev

      - name: Build & Package (Unix)
        if: matrix.os != 'windows-latest'
        run: bash ./release.sh

      - name: Build & Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash ./release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: spyweb-v*.*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/spyweb-v*.*
          generate_release_notes: true
          draft: false
          prerelease: false

name: Release Binaries

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: spyweb-linux
          - os: macos-latest
            artifact_name: spyweb-macos
          - os: windows-latest
            artifact_name: spyweb-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libx11-dev libwayland-dev libxkbcommon-dev libxdo-dev

      - name: Build & Package (default)
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          export SPYWEB_VERSION=$VERSION
          bash ./release.sh
          
          for f in spyweb-v*.tar.gz; do
            [ -e "$f" ] || continue
            new_f=$(echo "$f" | sed "s/-v$VERSION//")
            echo "Copying $f to $new_f"
            cp "$f" "$new_f"
          done

      - name: Build & Package (SQLite)
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          export SPYWEB_VERSION=$VERSION
          bash ./release.sh sql
          
          for f in spyweb-v*.tar.gz; do
            [ -e "$f" ] || continue
            new_f=$(echo "$f" | sed "s/-v$VERSION//")
            echo "Copying $f to $new_f"
            cp "$f" "$new_f"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: spyweb-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
            echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Check if pre-release
        id: check_prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Strip leading 'v' if present for changelog lookup
          VER="${VERSION#v}"
          # Extract section for this version (between ## [VERSION] and next ## [)
          BODY=$(awk "/^## \\[$VER\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION"
          fi
          # Use delimiter to preserve newlines in output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Tagged Release
        if: steps.check_prerelease.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: release-assets/spyweb-v*.tar.gz
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}

      - name: Create/Update Latest Release
        if: steps.check_prerelease.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: "Always points to the most recent build of SpyWeb."
          files: |
            release-assets/spyweb-linux-*.tar.gz
            release-assets/spyweb-macos-*.tar.gz
            release-assets/spyweb-windows-*.tar.gz
          draft: false
          prerelease: false
          make_latest: true

      - name: Create/Update Beta Release
        if: steps.check_prerelease.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta Release"
          body: "Always points to the most recent beta build of SpyWeb."
          files: |
            release-assets/spyweb-linux-*.tar.gz
            release-assets/spyweb-macos-*.tar.gz
            release-assets/spyweb-windows-*.tar.gz
          draft: false
          prerelease: true
          make_latest: false
